[project]
name = "fastapi-benchmark"
version = "0.1.0"
description = "FastAPI e-commerce benchmark: realistic async API + LAN load tester with live dashboard"
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.9.1",
]

[dependency-groups]
api = [
    "fastapi[standard]>=0.115.12",
    "uvicorn[standard]>=0.34.3",
    "gunicorn>=23.0.0",
    "sqlalchemy[asyncio]>=2.0.41",
    "alembic>=1.16.1",
    "aiosqlite>=0.21.0",
    "asyncpg>=0.30.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.20",
    "aiofiles>=24.1.0",
    "pillow>=11.2.1",
]
tester = [
    "httpx>=0.28.1",
    "fastapi>=0.115.12",
    "uvicorn>=0.34.3",
    "jinja2>=3.1.6",
]
dev = [
    "faker>=37.3.0",
    "rich>=14.0.0",
]

[project.scripts]
start-api    = "api.main:start"
start-tester = "load_tester.runner:main"
seed-db      = "scripts.seed_db:main"

[tool.uv]
default-groups = []

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "load_tester", "scripts"]
